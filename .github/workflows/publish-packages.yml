# LombokDNS — Publish to GitHub Packages (5 registries)
# Auto-triggered when a GitHub Release is published.
# Also callable from other workflows via workflow_call, or manually.
# Publishes: npm (GPR), Container (ghcr.io), Maven (webjar), NuGet, RubyGems
name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    name: npm (GPR)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@codinglombok'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Scope package name for GPR and publish
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.name = '@codinglombok/lombokdns';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-container:
    name: Container (ghcr.io)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate Dockerfile
        run: |
          cat > Dockerfile <<'DOCKER'
          FROM node:22-alpine AS build
          WORKDIR /app
          COPY package.json package-lock.json ./
          COPY README.md ./
          RUN npm ci --ignore-scripts
          COPY src/ src/
          COPY tsconfig.json ./
          RUN npx tsc
          FROM node:22-alpine
          WORKDIR /app
          COPY --from=build /app/dist dist/
          COPY --from=build /app/package.json .
          COPY --from=build /app/README.md .
          COPY LICENSE .
          DOCKER
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/codinglombok/lombokdns:${{ needs.version.outputs.version }}

  publish-maven:
    name: Maven (webjar)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Configure Maven authentication
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
      - name: Build and publish Maven package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          GROUP="com.github.codinglombok"
          ARTIFACT="lombokdns"
          MVN_DIR="maven-pkg"
          mkdir -p "$MVN_DIR/META-INF/resources/webjars/$ARTIFACT/$VERSION"
          cp -r dist/* "$MVN_DIR/META-INF/resources/webjars/$ARTIFACT/$VERSION/"
          cat > "$MVN_DIR/pom.xml" <<EOF
          <project><modelVersion>4.0.0</modelVersion>
            <groupId>$GROUP</groupId><artifactId>$ARTIFACT</artifactId>
            <version>$VERSION</version><packaging>jar</packaging>
            <name>LombokDNS</name>
            <url>https://github.com/codinglombok/LombokDNS</url>
            <licenses><license><name>Apache-2.0</name></license></licenses>
          </project>
          EOF
          cd "$MVN_DIR"
          jar cf "../$ARTIFACT-$VERSION.jar" .
          mvn deploy:deploy-file \
            -DgroupId="$GROUP" -DartifactId="$ARTIFACT" -Dversion="$VERSION" \
            -Dpackaging=jar -Dfile="../$ARTIFACT-$VERSION.jar" -DpomFile=pom.xml \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/codinglombok/LombokDNS"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  publish-nuget:
    name: NuGet
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Build and publish NuGet package
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p nuget-content/content/dist
          cp -r dist/* nuget-content/content/dist/
          cat > lombokdns.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <PackageId>codinglombok.LombokDNS</PackageId>
              <Version>$VERSION</Version>
              <Authors>codinglombok</Authors>
              <Description>Complete DNS protocol library</Description>
              <PackageLicenseExpression>Apache-2.0</PackageLicenseExpression>
              <PackageProjectUrl>https://github.com/codinglombok/LombokDNS</PackageProjectUrl>
              <RepositoryUrl>https://github.com/codinglombok/LombokDNS.git</RepositoryUrl>
              <RepositoryType>git</RepositoryType>
              <IncludeBuildOutput>false</IncludeBuildOutput>
            </PropertyGroup>
            <ItemGroup>
              <Content Include="dist/**" Pack="true" PackagePath="content/dist" />
            </ItemGroup>
          </Project>
          EOF
          dotnet pack -c Release -o ./nupkg
          dotnet nuget push "./nupkg/codinglombok.LombokDNS.$VERSION.nupkg" \
            --source "https://nuget.pkg.github.com/codinglombok/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}"

  publish-rubygems:
    name: RubyGems (GPR)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
      - name: Build and publish gem
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p lib/lombokdns
          echo "module Lombokdns; VERSION = '$VERSION'; end" > lib/lombokdns/version.rb
          echo "require 'lombokdns/version'" > lib/lombokdns.rb
          cat > lombokdns.gemspec <<GEMSPEC
          Gem::Specification.new do |s|
            s.name        = 'lombokdns'
            s.version     = '$VERSION'
            s.summary     = 'Complete DNS protocol library'
            s.authors     = ['codinglombok']
            s.license     = 'Apache-2.0'
            s.homepage    = 'https://github.com/codinglombok/LombokDNS'
            s.files       = Dir['lib/**/*.rb']
          end
          GEMSPEC
          gem build lombokdns.gemspec
          mkdir -p ~/.gem
          cat > ~/.gem/credentials <<CRED
          ---
          :github: Bearer ${{ secrets.GITHUB_TOKEN }}
          CRED
          chmod 0600 ~/.gem/credentials
          gem push --key github --host https://rubygems.pkg.github.com/codinglombok "lombokdns-$VERSION.gem"
